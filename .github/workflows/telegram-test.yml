name: Telegram test ping

# Manual-only: sends one test message to confirm the Telegram wiring
# (bot token + chat id) works. Safe to run anytime.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send test message
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${TG_TOKEN:-}" ] || [ -z "${TG_CHAT:-}" ]; then
            echo "::error::Missing TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID secret"; exit 1
          fi
          code=$(curl -s -o /tmp/resp.json -w '%{http_code}' \
            -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -H 'content-type: application/json' \
            -d "{\"chat_id\":\"${TG_CHAT}\",\"text\":\"✅ GMSim monitors connected — this is a test message.\"}")
          echo "Telegram HTTP $code"
          cat /tmp/resp.json; echo
          test "$code" = "200"
